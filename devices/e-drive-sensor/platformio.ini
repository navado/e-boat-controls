; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:avr-pannel]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
	SPI
	Wire
	u8g2
	matthew-dickson-epic/TimeInterrupt@^1.0.2
upload_port = /dev/tty.usbserial-1340
upload_speed = 115200
build_src_filter = +<*.cpp> +<include/*.h> +<lib/**/*.h> +<lib/**/*.cpp> -<main-sensor.cpp>
build_flags =
	-D PANNEL_NANO
	-D BUTTONS_POLLING
	-D LOG_LEVEL=3

[env:stm-panel]
platform = ststm32
framework = arduino
board = bluepill_f103c8
; upload_port = /dev/tty.usbmodem13401
; upload_protocol = dfu
; upload_flags = -c set CPUTAPID 0x2ba01477
upload_protocol = jlink
upload_port = jlink
build_src_filter = +<*.cpp> +<include/*.h> +<lib/**/*.h> +<lib/**/*.cpp> +<**/ui.cpp> -<main-sensor.cpp>
lib_deps =
	u8g2
build_flags =
	-D PANNEL_STM32
	-D LOG_LEVEL=2

[env:sensor]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
	matthew-dickson-epic/TimeInterrupt@^1.0.2
upload_port = /dev/tty.usbserial-1340
build_src_filter = +<*.cpp> +<include/*.h> +<lib/**/*.h> +<lib/**/*.cpp> -<**/ui.h> -<**/ui.cpp> -<main-pannel.cpp>
build_flags =
	-D SENSOR
	-D LOG_LEVEL=2

[env:throttle-stm]
; STM32F103C8 (BluePill) throttle controller — pot input, NMEA0183 GPS on Serial2
; NMEA0183_THROTTLE: GPS device wired to throttle (Serial2 RX=PA3); motor sentences on TX=PA2
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = jlink
upload_port = jlink
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
build_flags =
	-D THROTTLE_STM32
	-D THROTTLE_POT
	-D NMEA0183_THROTTLE
	-D LOG_LEVEL=2

[env:throttle-stm-enc]
; Same hardware but with quadrature encoder instead of potentiometer
; NMEA0183_THROTTLE: GPS device wired to throttle (Serial2 RX=PA3); motor sentences on TX=PA2
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = jlink
upload_port = jlink
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
build_flags =
	-D THROTTLE_STM32
	-D THROTTLE_ENC
	-D NMEA0183_THROTTLE
	-D LOG_LEVEL=2

[env:throttle-stm-nmea2k]
; Throttle with pot + NMEA 2000 CAN bus (receive nav data + transmit motor PGNs)
; Requires SN65HVD230 CAN transceiver on PA11/PA12.
; Motor NMEA0183 sentences also sent on Serial2 TX (PA2) to external NMEA bus.
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = jlink
upload_port = jlink
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
	ttlappalainen/NMEA2000@^4.21.6
	ttlappalainen/NMEA2000_stm32@^1.0.0
build_flags =
	-D THROTTLE_STM32
	-D THROTTLE_POT
	-D NMEA2000
	-D LOG_LEVEL=2

[env:throttle-stm-enc-nmea2k]
; Throttle with encoder + NMEA 2000 CAN bus (receive nav data + transmit motor PGNs)
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = jlink
upload_port = jlink
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
	ttlappalainen/NMEA2000@^4.21.6
	ttlappalainen/NMEA2000_stm32@^1.0.0
build_flags =
	-D THROTTLE_STM32
	-D THROTTLE_ENC
	-D NMEA2000
	-D LOG_LEVEL=2

[env:throttle-esp32]
; ESP32-PICO-D4 throttle controller — pot input, NMEA0183 GPS on Serial2 (GPIO16/17)
; Motor NMEA0183 sentences on Serial2 TX; GPS input on Serial2 RX
platform = espressif32
board = pico32
framework = arduino
upload_protocol = esptool
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
build_flags =
	-D THROTTLE_ESP32
	-D THROTTLE_POT
	-D NMEA0183_THROTTLE
	-D LOG_LEVEL=2

[env:throttle-esp32-enc]
; ESP32-PICO-D4 throttle controller — quadrature encoder input
platform = espressif32
board = pico32
framework = arduino
upload_protocol = esptool
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
build_flags =
	-D THROTTLE_ESP32
	-D THROTTLE_ENC
	-D NMEA0183_THROTTLE
	-D LOG_LEVEL=2

[env:throttle-esp32-nmea2k]
; ESP32-PICO-D4 throttle + NMEA 2000 via ESP32 TWAI peripheral (GPIO21/22)
; Requires SN65HVD230 or ISO1050 CAN transceiver on GPIO21/22.
; Motor PGNs 127488/127508 transmitted; nav PGNs 128259/129026 received.
; Motor NMEA0183 sentences also output on Serial2 TX (GPIO17).
platform = espressif32
board = pico32
framework = arduino
upload_protocol = esptool
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
	ttlappalainen/NMEA2000@^4.21.6
	ttlappalainen/NMEA2000_esp32@^1.0.0
build_flags =
	-D THROTTLE_ESP32
	-D THROTTLE_POT
	-D NMEA2000
	-D LOG_LEVEL=2

[env:throttle-esp32-enc-nmea2k]
; ESP32-PICO-D4 throttle with encoder + NMEA 2000 CAN
platform = espressif32
board = pico32
framework = arduino
upload_protocol = esptool
build_src_filter =
	+<comms.cpp>
	+<models.cpp>
	+<buttons.cpp>
	+<main-throttle.cpp>
lib_deps =
	TimerInterrupt_Generic@^1.13.0
	ttlappalainen/NMEA2000@^4.21.6
	ttlappalainen/NMEA2000_esp32@^1.0.0
build_flags =
	-D THROTTLE_ESP32
	-D THROTTLE_ENC
	-D NMEA2000
	-D LOG_LEVEL=2

[env:stm-panel-nmea]
; STM32 panel with NMEA0183 GPS wired to panel (USART3 PB11/PB10).
; Panel broadcasts GPSRPT on the internal bus; other nodes vote on this source.
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = jlink
upload_port = jlink
build_src_filter = +<*.cpp> +<include/*.h> +<lib/**/*.h> +<lib/**/*.cpp> +<**/ui.cpp> -<main-sensor.cpp>
lib_deps =
	u8g2
build_flags =
	-D PANNEL_STM32
	-D NMEA0183_PANEL
	-D LOG_LEVEL=2

[env:native]
platform = native
build_src_filter = +<src/comms.cpp> +<src/models.cpp>
build_flags =
	-D NATIVE_TEST
	-D LOG_LEVEL=4
	-I include
	-I test
	-std=c++14

