name: CI

on:
  push:
    branches: [main, master, develop, "claude/**", "feature/**"]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ── Unit tests (pure C++, no hardware required) ───────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile test suite
        working-directory: devices/e-drive-sensor
        run: |
          g++ -std=c++14 \
            -I include \
            -I test \
            -D NATIVE_TEST \
            -D LOG_LEVEL=4 \
            -Wall -Wextra -Werror \
            src/comms.cpp src/models.cpp test/test_main.cpp \
            -o /tmp/e_boat_tests

      - name: Run unit tests
        run: /tmp/e_boat_tests

  # ── Firmware builds (matrix across all firmware targets) ──────────────────
  build:
    name: Build (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - env: sensor
            description: "Arduino Nano — motor/sensor controller"
          - env: avr-pannel
            description: "Arduino Nano — control panel"
          - env: stm-panel
            description: "STM32 BluePill — control panel"
          - env: throttle-stm
            description: "STM32 BluePill — throttle controller (pot input)"
          - env: throttle-stm-enc
            description: "STM32 BluePill — throttle controller (encoder input)"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Cache PlatformIO toolchains and packages between runs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('devices/e-drive-sensor/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.env }}-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware — ${{ matrix.env }}
        working-directory: devices/e-drive-sensor
        run: pio run -e ${{ matrix.env }}

      # Upload compiled .hex / .elf / .bin as build artifacts
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: |
            devices/e-drive-sensor/.pio/build/${{ matrix.env }}/*.hex
            devices/e-drive-sensor/.pio/build/${{ matrix.env }}/*.elf
            devices/e-drive-sensor/.pio/build/${{ matrix.env }}/*.bin
          if-no-files-found: warn

  # ── Collect all firmware into a single release artifact ───────────────────
  package:
    name: Package all firmware
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware

      - name: List collected firmware
        run: find firmware -type f | sort

      - name: Upload combined firmware package
        uses: actions/upload-artifact@v4
        with:
          name: firmware-all-${{ github.sha }}
          path: firmware/
          retention-days: 90
          if-no-files-found: warn
